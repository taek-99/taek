{% extends "articles/base.html" %}


{% block content %}
<h1>EDIT</h1>

<form action="{% url "articles:update" article.pk %}" method=POST>
{% csrf_token %}
    <div>
        <label for="title">제목이다</label>
        <input type="text" name="title" id="title" value="{{article.title}}">
    </div>

    <div>
        <label for="content">내용이다</label>
        <input type="content" name="content" id="content" value="{{article.content}}">
    </div>

    <input type="submit" value="게시글 수정하기">
</form>


{% endblock content %}
