<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>내 주변 음식점 (입력)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    form { display: grid; gap: 10px; max-width: 420px; }
    input, select, button { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>🍜 내 주변 음식점 찾기</h1>
  <p>JavaScript 없이 테스트: 위도·경도를 직접 입력 후 제출하세요.</p>

  <form action="{% url 'articles:restaurants' %}" method="get">
    <label>위도(lat)
      <input name="lat" type="number" step="0.000001" placeholder="예: 37.4979" required>
    </label>
    <label>경도(lng)
      <input name="lng" type="number" step="0.000001" placeholder="예: 127.0276" required>
    </label>
    <label>반경
      <select name="radius">
        <option value="500">500m</option>
        <option value="1000" selected>1km</option>
        <option value="1500">1.5km</option>
        <option value="2000">2km</option>
      </select>
    </label>
    <label>개수
      <select name="size">
        <option value="10" selected>10개</option>
        <option value="5">5개</option>
        <option value="15">15개(최대)</option>
      </select>
    </label>
    <button type="submit">검색</button>
  </form>
</body>
</html>
